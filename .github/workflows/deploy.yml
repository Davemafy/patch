name: deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  convex-static-hosting:
    runs-on: ubuntu-latest
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require Convex deployment key
        shell: bash
        run: |
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then
            echo "::error::Add the Convex deploy key as the repository secret CONVEX_DEPLOY_KEY."
            exit 1
          fi
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Deploy Convex backend
        run: npx convex deploy
      - name: Upload hosted frontend
        run: npx @convex-dev/static-hosting upload --build --component staticHosting
      - name: Smoke hosted app and webhook route
        shell: bash
        run: |
          curl --fail --retry 8 --retry-all-errors --retry-delay 2 --silent --show-error \
            https://aware-porpoise-430.convex.site/ -o /tmp/patch.html
          grep -q '<div id="root"></div>' /tmp/patch.html
          grep -q 'assets/' /tmp/patch.html
          webhook_status="$(curl --silent --show-error -o /tmp/webhook.txt -w '%{http_code}' \
            -X POST -H 'content-type: application/json' --data '{}' \
            https://aware-porpoise-430.convex.site/agentmail/webhook)"
          test "$webhook_status" = "401"
          grep -q 'Invalid webhook signature' /tmp/webhook.txt
      - name: Smoke GPT-OSS and Firecrawl discovery
        shell: bash
        run: |
          repair_id="$(npx convex run repairs:createRepair '{"description":"My bedroom doorknob is broken. The handle turns but the door won’t open properly.","area":"Abuja"}' | tr -d '"\r\n')"
          test -n "$repair_id"
          echo "Created smoke repair: $repair_id"
          npx convex run discovery:findRepairPeople "{\"repairId\":\"$repair_id\"}"
          view="$(npx convex run repairs:getRepair "{\"repairId\":\"$repair_id\"}")"
          candidate_count="$(printf '%s' "$view" | jq '.candidates | length')"
          contactable_count="$(printf '%s' "$view" | jq '[.candidates[] | select(.email != null and .email != "")] | length')"
          category="$(printf '%s' "$view" | jq -r '.repair.category // ""')"
          query="$(printf '%s' "$view" | jq -r '.repair.searchQuery // ""')"
          echo "Discovery category: $category"
          echo "Discovery query: $query"
          echo "Candidates: $candidate_count; contactable: $contactable_count"
          printf '%s' "$view" | jq -r '.candidates[] | [.name, .sourceUrl, ((.email // "") != "")] | @tsv'
