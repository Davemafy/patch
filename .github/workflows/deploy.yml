name: deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  convex-static-hosting:
    runs-on: ubuntu-latest
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require Convex deployment key
        shell: bash
        run: |
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then
            echo "::error::Add the Convex deploy key as the repository secret CONVEX_DEPLOY_KEY."
            exit 1
          fi
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Deploy Convex backend
        run: npx convex deploy
      - name: Upload hosted frontend
        run: npx @convex-dev/static-hosting upload --build --component staticHosting
