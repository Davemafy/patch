name: deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  convex-static-hosting:
    runs-on: ubuntu-latest
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check deployment key
        if: env.CONVEX_DEPLOY_KEY == ''
        run: echo "Convex deployment skipped because CONVEX_DEPLOY_KEY is not configured."
      - name: Install
        if: env.CONVEX_DEPLOY_KEY != ''
        run: npm install --no-audit --no-fund
      - name: Deploy Patch
        if: env.CONVEX_DEPLOY_KEY != ''
        run: npm run deploy
